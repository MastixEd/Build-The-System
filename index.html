<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build The System · Mastix Ed</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--abyss:#070e1c;--teal:#2fd6c4;--amber:#ffb347;--rose:#ff4d7a;--ink:#e8f1f5;--lilac:#b79cff;--mint:#5af0a8}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--abyss);color:var(--ink);font-family:Sora,system-ui,sans-serif}
canvas{position:fixed;inset:0;display:block}
.bar{position:fixed;left:0;right:0;height:7vh;background:#000;z-index:5;transition:height 1.6s ease}
#b1{top:0}#b2{bottom:0}
body.intro .bar{height:50vh}
#hud{position:fixed;top:calc(7vh + 10px);left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;z-index:6;pointer-events:none}
#hud b{font-weight:700;letter-spacing:.02em}
#hud small{display:block;font-weight:300;opacity:.7}
#snd{pointer-events:auto;cursor:pointer;background:rgba(10,24,40,.7);color:var(--ink);border:1px solid rgba(47,214,196,.5);border-radius:999px;padding:9px 16px;font:500 14px Sora,sans-serif}
#snd:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#ui{position:fixed;left:0;right:0;bottom:calc(7vh + 8px);z-index:6;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 14px}
#panel{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1000px}
#panel button,.go{cursor:pointer;background:rgba(10,24,40,.82);color:var(--ink);border:1px solid rgba(47,214,196,.55);border-radius:14px;padding:12px 16px;font:500 14px/1.35 Sora,sans-serif;max-width:250px;text-align:left;backdrop-filter:blur(8px);transition:transform .15s,border-color .15s,background .15s}
#panel button:hover{transform:translateY(-3px);border-color:var(--amber);background:rgba(30,50,70,.9)}
#panel button.hot{background:var(--teal);color:#032;font-weight:700;text-align:center}
#panel .q{flex-basis:100%;max-width:none;text-align:center;font-size:16px;background:rgba(80,10,30,.7);border:1px solid var(--rose);border-radius:14px;padding:12px 16px}
#dlg{width:min(900px,100%);background:rgba(5,12,24,.82);border-left:4px solid var(--amber);border-radius:10px;padding:14px 18px;backdrop-filter:blur(8px);min-height:78px}
#who{font-weight:700;font-size:13px;margin-bottom:4px}
#txt{font-weight:300;font-size:16px;line-height:1.5}
#title{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(7,14,28,.25),rgba(7,14,28,.92));transition:opacity 1.2s}
#title.gone{opacity:0;pointer-events:none}
#title h1{font-weight:700;font-size:clamp(38px,8vw,92px);line-height:1;letter-spacing:-.02em}
#title p{max-width:520px;margin:18px 0 28px;font-weight:300;font-size:18px;line-height:1.5;opacity:.9}
#title .go{font-size:18px;font-weight:700;background:var(--teal);color:#032;padding:16px 34px;max-width:none}
#title small{margin-top:22px;opacity:.55}
#final{font-size:clamp(15px,2.4vw,24px);font-weight:500;text-align:center;line-height:1.6}
@media(max-width:600px){#txt{font-size:14px}#panel button{max-width:none;flex:1 1 140px}}
</style></head>
<body class="intro">
<div class="bar" id="b1"></div><div class="bar" id="b2"></div>
<div id="hud"><div><b>BUILD THE SYSTEM</b><small id="sub">Mastix Ed · AI Integration Project</small></div>
<button id="snd" aria-pressed="true">🔊 Sound on</button></div>
<div id="title"><h1>Build<br>The System</h1>
<p>One AI is powerful. A system of AIs can become something much bigger. Connect the team, survive Pixi's chaos, and keep a human in the loop.</p>
<button class="go" id="begin">Begin mission</button><small>Best with sound on · Mastix Ed Lesson 28</small></div>
<div id="ui"><div id="panel"></div><div id="dlg"><div id="who"></div><div id="txt"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- AUDIO (synthesised, no files) ---------- */
let AC,master,on=true;
function initAudio(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=on?.5:0;master.connect(AC.destination);
  /* playful bouncy loop: pentatonic plucks + bubbly bass */
  const P=[523.3,587.3,659.3,784,880,1046.5],M=[0,2,4,2,5,4,2,0,1,3,4,3,5,4,3,1],B=[130.8,98,110,87.3];
  let st=0;
  setInterval(()=>{
    if(document.hidden)return;
    const i=st%16,bar=Math.floor(st/16)%4;
    tone(P[M[i]]*(bar%2?1:1.122),.22,'triangle',.05);
    if(i%4===2)tone(P[M[(i+5)%16]]*2,.12,'sine',.025);
    if(i%2===0)tone(B[bar],.2,'sine',.09);
    if(i%4===0)tone(60,.12,'sine',.1);
    st++;
  },230);
}
function tone(f,d=.2,t='sine',v=.15,s=0){
  if(!AC||!on)return;
  const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+s;
  o.type=t;o.frequency.value=f;
  g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.02);g.gain.exponentialRampToValueAtTime(.001,n+d);
  o.connect(g);g.connect(master);o.start(n);o.stop(n+d+.05);
}
const sfx={
  click:()=>tone(880,.08,'sine',.1),
  ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.14,i*.08)),
  bad:()=>{tone(130,.35,'sawtooth',.14);tone(98,.4,'sawtooth',.14,.12)},
  alarm:()=>[0,1,2,3].forEach(i=>tone(i%2?330:440,.16,'square',.07,i*.18)),
  link:()=>{tone(440,.15,'sine',.12);tone(660,.2,'sine',.12,.1)},
  whoosh:()=>{tone(200,.5,'sawtooth',.04);tone(400,.6,'sine',.05,.1)}
};
const snd=document.getElementById('snd');
snd.onclick=()=>{
  on=!on;initAudio();
  master.gain.setTargetAtTime(on?.5:0,AC.currentTime,.05);
  snd.textContent=on?'🔊 Sound on':'🔇 Sound off';snd.setAttribute('aria-pressed',on);
};

/* ---------- 3D SCENE ---------- */
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x070e1c);S.fog=new THREE.FogExp2(0x070e1c,.024);
const C=new THREE.PerspectiveCamera(55,1,.1,200);
S.add(new THREE.AmbientLight(0x4466aa,.7));
const pl=new THREE.PointLight(0x2fd6c4,2.2,70);pl.position.set(0,8,8);S.add(pl);
const pl2=new THREE.PointLight(0xffb347,1.2,50);pl2.position.set(0,-1,-8);S.add(pl2);
const grid=new THREE.GridHelper(80,80,0x1d6a70,0x10263a);grid.position.y=-3.2;S.add(grid);
const sv=[];for(let i=0;i<1100;i++)sv.push((Math.random()-.5)*120,Math.random()*50-5,(Math.random()-.5)*120-20);
const stars=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(sv,3)),new THREE.PointsMaterial({color:0x9fe8ff,size:.18,transparent:true,opacity:.8}));S.add(stars);

const NAMES=['INPUT','ANALYSIS AI','PREDICTION AI','DECISION AI','ACTION','HUMAN'];
const COL=[0x2fd6c4,0x4aa8ff,0xb79cff,0xffb347,0x5af0a8,0xff8fb1];
const GEO=[new THREE.OctahedronGeometry(1.1),new THREE.IcosahedronGeometry(1.1),new THREE.TorusKnotGeometry(.7,.26,70,8),new THREE.DodecahedronGeometry(1.1),new THREE.BoxGeometry(1.5,1.5,1.5),new THREE.SphereGeometry(.95,24,16)];
const POS=[[-10,0,0],[-5,1.2,-2],[0,0,-3],[5,1.2,-2],[10,0,0],[0,5.5,-4]].map(p=>new THREE.Vector3(...p));
function label(t,col){
  const c=document.createElement('canvas');c.width=320;c.height=64;const x=c.getContext('2d');
  x.font='700 30px Sora,sans-serif';x.textAlign='center';x.fillStyle=col;x.fillText(t,160,42);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(4.4,.88,1);return s;
}
const nodes=POS.map((p,i)=>{
  const g=new THREE.Group();g.position.copy(p);
  const m=new THREE.MeshStandardMaterial({color:0x16314a,emissive:0x000000,roughness:.35,metalness:.6,transparent:true,opacity:.35,wireframe:true});
  const core=new THREE.Mesh(GEO[i],m);
  const halo=new THREE.Mesh(new THREE.SphereGeometry(1.9,20,14),new THREE.MeshBasicMaterial({color:COL[i],transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  const lb=label(NAMES[i],'#'+COL[i].toString(16).padStart(6,'0'));lb.position.y=-2.1;lb.visible=false;
  g.add(core,halo,lb);S.add(g);
  return{g,core,halo,lb,lit:false,alert:false,ok:0};
});
function light(i){const n=nodes[i];n.lit=true;n.core.material.wireframe=false;n.core.material.opacity=1;n.core.material.color.setHex(COL[i]);n.core.material.emissive.setHex(COL[i]);n.core.material.emissiveIntensity=.55;n.lb.visible=true;}
function dim(i){const n=nodes[i];n.lit=false;n.alert=false;n.core.material.wireframe=true;n.core.material.opacity=.35;n.core.material.color.setHex(0x16314a);n.core.material.emissive.setHex(0);n.lb.visible=false;n.halo.material.opacity=0;}

const links=[];
function mkLink(a,b,lift,col){
  const pts=new THREE.QuadraticBezierCurve3(POS[a].clone(),POS[a].clone().add(POS[b]).multiplyScalar(.5).add(new THREE.Vector3(0,lift,0)),POS[b].clone());
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts.getPoints(40)),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.08}));
  const pk=new THREE.Mesh(new THREE.SphereGeometry(.2,10,8),new THREE.MeshBasicMaterial({color:0xffffff,blending:THREE.AdditiveBlending}));pk.visible=false;
  S.add(line,pk);const L={curve:pts,line,pk,on:false,t:Math.random()};links.push(L);return L;
}
for(let i=0;i<4;i++)mkLink(i,i+1,.4,0x2fd6c4);
const LOOP=mkLink(4,0,-6,0xffb347), H1=mkLink(3,5,.5,0xff8fb1), H2=mkLink(5,4,.5,0xff8fb1);
function linkOn(L){L.on=true;L.line.material.opacity=1;L.pk.visible=true;}
function linkOff(L){L.on=false;L.line.material.opacity=.08;L.pk.visible=false;}

let shake=0,tp=new THREE.Vector3(0,4,24),tl=new THREE.Vector3(0,1.5,-2),tick=0;
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
C.position.copy(tp);
function size(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();}
addEventListener('resize',size);size();
const look=new THREE.Vector3(0,1.5,-2);
(function loop(){
  requestAnimationFrame(loop);tick+=.016;
  const wide=Math.max(1,1.15/C.aspect*1.0);
  const dest=tp.clone();dest.z*=wide;dest.x+=Math.sin(tick*.25)*(calm?0:1.6);dest.y+=Math.sin(tick*.35)*(calm?0:.4);
  C.position.lerp(dest,.025);look.lerp(tl,.04);
  if(shake>0&&!calm){C.position.x+=(Math.random()-.5)*shake;C.position.y+=(Math.random()-.5)*shake;shake*=.92;}
  C.lookAt(look);
  stars.rotation.y+=.0004;
  nodes.forEach((n,i)=>{
    n.core.rotation.y+=.008+i*.0007;n.core.rotation.x+=.004;
    n.g.position.y=POS[i].y+(n.lit?Math.sin(tick*1.5+i)*.25:0);
    if(n.alert){const f=(Math.sin(tick*14)+1)/2;n.core.material.emissive.setHex(0xff2255);n.core.material.emissiveIntensity=.3+f;n.halo.material.color.setHex(0xff2255);n.halo.material.opacity=.15+f*.25;}
    else if(n.lit){n.core.material.emissive.setHex(COL[i]);n.core.material.emissiveIntensity=.5+Math.sin(tick*2+i)*.15;n.halo.material.color.setHex(COL[i]);n.halo.material.opacity=Math.max(.08,n.halo.material.opacity*.95);}
  });
  links.forEach(L=>{if(!L.on)return;L.t=(L.t+.006)%1;L.pk.position.copy(L.curve.getPoint(L.t));});
  R.render(S,C);
})();
function pulse(i,o=.6){nodes[i].halo.material.opacity=o;}
function shot(p,l){tp.set(...p);tl.set(...l);}

/* ---------- STORY + GAME ---------- */
const WHO={Spark:'#ffb347',Luna:'#b79cff',Pixi:'#5af0a8',System:'#2fd6c4'};
const $=id=>document.getElementById(id),panel=$('panel');
let typer;
function say(w,t){
  $('who').textContent=w==='System'?'MISSION CONTROL':'Professor '.slice(0,w==='Spark'?10:0)+w;
  $('who').style.color=WHO[w];$('dlg').style.borderColor=WHO[w];
  clearInterval(typer);let i=0;$('txt').textContent='';
  typer=setInterval(()=>{$('txt').textContent=t.slice(0,++i);if(i>=t.length)clearInterval(typer);},16);
}
function btns(list,cls){
  panel.innerHTML='';
  list.forEach(([label,fn,c])=>{const b=document.createElement('button');b.innerHTML=label;if(c||cls)b.className=c||cls;b.onclick=()=>{initAudio();sfx.click();fn(b);};panel.appendChild(b);});
}
function story(lines,done){
  let k=0;(function next(){
    if(k>=lines.length){done();return;}
    const [w,t,fx]=lines[k++];say(w,t);if(fx)fx();
    btns([['Continue',next]],'hot');
  })();
}
const MISSIONS=[
 {n:'🌊 Disaster Response AI',c:0x2fd6c4,s:['Rain and river sensors stream in','Vision AI spots flooding in Sector B','Prediction AI: flood probability 82%','Decision AI chooses: evacuate Sector B','Alerts sent to every phone in the zone']},
 {n:'🏫 Future School AI',c:0xb79cff,s:['Student answers and questions arrive','Analysis finds a gap in fractions','Prediction AI: this topic needs support next','Decision AI picks the best resources','A personal learning path is created']},
 {n:'🚀 Space Habitat AI',c:0x4aa8ff,s:['Spacecraft sensors report pressure and heat','Analysis detects an unusual vibration','Prediction AI: pump failure in 6 hours','Decision AI recommends switching to backup','Astronauts are alerted and protected']},
 {n:'🌍 Climate Guardian AI',c:0x5af0a8,s:['Satellite and ground data collected','Analysis detects shrinking forest cover','Prediction AI: wildfire risk rising','Decision AI recommends firebreak patrols','Response teams are deployed']},
 {n:'🏥 Healthcare Logistics AI',c:0xff8fb1,s:['Incoming patient information arrives','Analysis identifies urgent cases','Prediction AI: ward 3 will overflow','Decision AI prioritises beds and staff','Ambulances and supplies are coordinated']}
];
const CHAOS=[
 ['💣 Chaos 1 · One AI gives the wrong answer. What does your system do?',['Trust it. AIs are rarely wrong.','Cross-check it with another AI or sensor before acting.','Shut the entire system down forever.'],1,'Verification between components catches single failures.'],
 ['💣 Chaos 2 · AI #1 says SAFE. AI #2 says DANGER. Who decides?',['Whichever answered first.','Always assume SAFE.','Treat it as DANGER until checked, and ask a human.'],2,'Disagreement is a signal. Pause and escalate when risk is high.'],
 ['💣 Chaos 3 · An AI stops responding. Can the system continue?',['Wait forever.','Switch to a backup AI or a safe manual mode.','Let the next AI invent the missing answer.'],1,'Robust systems have fallbacks.'],
 ['💣 Chaos 4 · The data is incomplete. Should the system still decide?',['Guess and act immediately.','Ignore the missing data completely.','Flag the uncertainty, gather more data, act cautiously.'],2,'Good systems know when they are uncertain.'],
 ['💣 Chaos 5 · The AI makes a prediction, but a human disagrees. Who has the final say?',['The AI, always.','For high-risk decisions, the human.','Flip a coin.'],1,'Human oversight matters most when the stakes are high.']
];
let M,step,score,mist,ck;
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);

$('begin').onclick=()=>{
  initAudio();sfx.whoosh();$('title').classList.add('gone');document.body.classList.remove('intro');
  shot([0,5,20],[0,1,-2]);intro();
};
function intro(){
  [0,1,2,3,4,5].forEach(dim);links.forEach(linkOff);
  story([
   ['Spark','Today, you are not building an AI. You are building a TEAM of AIs.'],
   ['Luna','Watch this system. Vision AI: "I detect flooding." Prediction AI: "Probability 82%." Planning AI: "Route vehicles through Sector B." Decision AI: "Evacuate Sector B."',()=>[0,1,2,3].forEach((i,k)=>setTimeout(()=>{light(i);pulse(i);sfx.link();},k*500))],
   ['Pixi','Easy! Just ask one AI to do everything! ...Oops. The map data is 20 minutes old.',()=>setTimeout(()=>{nodes[2].alert=true;sfx.alarm();shake=.5;},300)],
   ['Spark','The problem is not necessarily the individual AIs. It is the CONNECTION between them. Now you build the system.',()=>{nodes.forEach((n,i)=>dim(i));sfx.whoosh();}]
  ],pickMission);
}
function pickMission(){
  shot([0,4,22],[0,1,-2]);
  say('Luna','Choose your mission. Every team needs a problem worth solving.');
  btns(MISSIONS.map((m,i)=>[m.n,()=>startBuild(i)]));
}
function startBuild(i){
  M=MISSIONS[i];step=0;score=0;mist=0;ck=0;placed={};[0,1,2,3,4,5].forEach(dim);links.forEach(linkOff);
  $('sub').textContent=M.n;shot([0,3,19],[0,1,-2]);sfx.whoosh();
  say('Luna','Build the pipeline in the right order. Click what should come next: INPUT, then analysis, prediction, decision and action.');
  tray();
}
function tray(){
  const order=shuffle([0,1,2,3,4]).filter(i=>i>=step&&!placed[i]);
  btns(order.map(i=>[M.s[i],()=>place(i)]));
}
let placed={};
function place(i){
  if(i===step){
    placed[i]=1;light(i);pulse(i,.7);sfx.ok();
    if(i>0)linkOn(links[i-1]);
    step++;
    const L={0:['Luna','Input online. Without good information, nothing else matters.'],1:['Luna','Analysis finds patterns in what came in.'],2:['Luna','Prediction estimates what may happen next.'],3:['Spark','The decision component chooses an action.'],4:['Spark','Action carries it out. But systems that cannot learn from results fall behind.']}[i];
    if(step===5){say(...L);btns([['🔄 Close the feedback loop',loop]],'hot');shot([0,6,20],[0,1,-2]);}
    else{say(...L);tray();}
  }else{
    mist++;sfx.bad();shake=.4;
    say('Pixi','Hmm, that does not fit there yet. What has to happen before it?');
  }
}
function loop(){
  linkOn(LOOP);sfx.link();pulse(0,.7);
  say('Spark','ACTION creates NEW DATA, which goes back into the AI system for a NEW DECISION. Now you have built a loop.');
  btns([['👨‍💻 Add human oversight',human]],'hot');
}
function human(){
  light(5);linkOn(H1);linkOn(H2);sfx.ok();shake=.2;shot([0,5,19],[0,2,-2]);
  say('Luna','A human can monitor the decision and step in. Your system is ready.');
  btns([['▶ Run the system',run]],'hot');
}
function run(){
  sfx.whoosh();
  say('System','Running... data flows through every connection.');
  [0,1,2,3,4].forEach((i,k)=>setTimeout(()=>{pulse(i,.8);tone(300+k*120,.2,'triangle',.12);},k*450));
  setTimeout(()=>{
    sfx.alarm();shake=.6;
    story([['Pixi','Your systems are about to encounter... CHAOS!',()=>{}]],()=>{ck=0;chaos();});
  },2600);
}
function chaos(){
  shot([0,2,15],[0,1,-2]);
  const c=CHAOS[ck],t=Math.floor(Math.random()*4);
  nodes[t].alert=true;sfx.alarm();shake=.4;
  say('Pixi','Defend your system. Pick the best response.');
  const opts=shuffle([0,1,2]);
  panel.innerHTML='';
  const q=document.createElement('div');q.className='q';q.textContent=c[0];panel.appendChild(q);
  opts.forEach(oi=>{const b=document.createElement('button');b.textContent=c[1][oi];b.onclick=()=>{
    initAudio();nodes.forEach(n=>n.alert=false);
    const good=oi===c[2];
    if(good){score++;sfx.ok();pulse(t,.9);pulse(5,.9);say('Spark','Well defended. '+c[3]);}
    else{sfx.bad();shake=.6;say('Luna','That leaves a weakness. '+c[3]);}
    ck++;
    btns([[ck<5?'Next chaos card':'See results',ck<5?chaos:end]],'hot');
  };panel.appendChild(b);});
}
function end(){
  shot([0,8,26],[0,2,-2]);sfx.ok();setTimeout(sfx.ok,600);
  const rank=score>=5?'Systems Architect':score>=3?'Integrator':'Apprentice';
  say('Spark','AI is not the same as an AI SYSTEM. Chaos defended: '+score+' of 5. Rank: '+rank+'.');
  panel.innerHTML='<div class="q" id="final" style="background:rgba(5,40,50,.8);border-color:var(--teal)">AI SYSTEM =<br>AI + DATA + CONNECTIONS + DECISIONS + FEEDBACK + HUMAN OVERSIGHT<br><small style="font-weight:300">Exit challenge: "The hardest part of integrating multiple AI systems is ____ because ____." If you could add ONE more AI, what would it do?</small></div>';
  const b=document.createElement('button');b.className='hot';b.textContent='↻ Play another mission';
  b.onclick=()=>{sfx.click();placed={};[0,1,2,3,4,5].forEach(dim);links.forEach(linkOff);$('sub').textContent='Mastix Ed · AI Integration Project';pickMission();};
  panel.appendChild(b);
}
</script>
</body></html>
